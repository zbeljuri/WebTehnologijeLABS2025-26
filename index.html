<!DOCTYPE html>
<html lang="bs">
  <head>
    <meta charset="UTF-8" />
    <title>Interaktivno stablo</title>
    <style>
      .godina {
        cursor: pointer;
        font-weight: bold;
      }
      .predmeti {
        display: none;
        margin-left: 20px;
      }
    </style>
  </head>
  <body>
    <div>
      <span class="godina" id="prva">+ Prva godina</span>
      <div class="predmeti" id="prvaLista">
        <p>- IM1</p>
        <p>- IM2</p>
        <p>- OE</p>
        <p>- EES</p>
        <p>- IF1</p>
        <p>- UUP</p>
        <p>- LAG</p>
        <p>- TP</p>
      </div>
    </div>

    <div>
      <span class="godina" id="druga">+ Druga godina</span>
      <div class="predmeti" id="drugaLista">
        <p>- ASP</p>
        <p>- OOAD</p>
        <p>- DM</p>
        <p>- RA</p>
        <p>- RPR</p>
        <p>- LD</p>
        <p>- RMA</p>
        <p>- NA</p>
      </div>
    </div>

    <script src="stablo.js"></script>
  </body>
</html>
